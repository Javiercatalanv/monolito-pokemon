name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo sobre la misma rama cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint y formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

  tests:
    name: Tests
    runs-on: ubuntu-latest

    # Los tests corren contra un PostgreSQL real, no contra SQLite: es el mismo
    # motor que usa el proyecto y evita que una diferencia de dialecto aparezca
    # recien en produccion.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pokemon
          POSTGRES_PASSWORD: pokemon
          POSTGRES_DB: pokemon_counter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokemon -d pokemon_counter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Dentro del runner el servicio se expone en el 5432 estandar, no en el
      # 5434 que usa docker-compose para no chocar con otros proyectos locales.
      DATABASE_URL: postgresql+psycopg://pokemon:pokemon@localhost:5432/pokemon_counter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Aplicar migraciones
        run: alembic upgrade head

      - name: Verificar que no hay drift entre modelos y esquema
        # Falla si alguien cambio un modelo sin generar la migracion.
        run: alembic check

      - name: Verificar que el downgrade revierte el esquema
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Pytest con cobertura
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
